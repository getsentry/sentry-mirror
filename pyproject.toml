[project]
name = "sentry-mirror-tests"
version = "0.1.0"
description = "Integration tests for sentry-mirror"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0.0",
    "requests>=2.31.0",
    "urllib3>=2.6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[tool.pytest.ini_options]
log_level = "INFO"
testpaths = ["tests"]
python_files = ["test_*.py"]
